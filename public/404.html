<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Crushed!</title>
    <style>
        /* Dark Theme Setup */
        body {
            background-color: #0a0a0a;
            color: #eeeeee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 20px;
        }

        /* The Image Styling */
        .witch-img {
            width: 100%;
            max-width: 350px;
            border: 4px solid #333;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        

        p {
            font-size: 1.1rem;
            color: #999;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Return to OZ Button */
        .btn-oz {
            display: inline-block;
            background-color: #f4c430; /* Yellow Brick Road Gold */
            color: #000;
            padding: 15px 35px;
            font-weight: 900;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 50px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(244, 196, 48, 0.3);
        
        }

        
    </style>
</head>
<body>

    <div class="container">
        <h1></h1>
        <img src="404.png" alt="Page Crushed" class="witch-img">
        
        
        <a href="https://aethyr-global.com" class="btn-oz">Return to OZ</a>
        
       

</body>
</html>
