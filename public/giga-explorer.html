<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethyr Global | GIGA Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>:root{--gold:#c9a84c;--deep:#07070c;--surface:#111118;--surface2:#18181f;--text:#d8d2c4;--text-dim:#7a7568;} body{background-color:var(--deep);color:var(--text);font-family:'Crimson Pro',serif;margin:0;display:flex;height:100vh;overflow:hidden;} #sidebar{width:350px;background:var(--surface);border-right:1px solid rgba(201,168,76,0.2);overflow-y:auto;padding:20px;flex-shrink:0;} #content{flex-grow:1;overflow-y:auto;padding:40px;background:radial-gradient(circle at top right,rgba(201,168,76,0.05),transparent);} h1{font-family:'Cinzel',serif;font-size:1.4rem;color:var(--gold);margin:0;letter-spacing:0.1em;} .nav-link{display:block;margin-top:10px;color:var(--text-dim);text-decoration:none;font-size:0.8rem;font-family:'JetBrains Mono',monospace;} .tree-node{margin-left:15px;font-family:'JetBrains Mono',monospace;font-size:0.85rem;} .folder{cursor:pointer;padding:5px 0;color:var(--gold);user-select:none;} .folder::before{content:'▹ ';} .folder.open::before{content:'▿ ';} .file{padding:3px 0;color:var(--text-dim);cursor:pointer;} .children{display:none;} .children.visible{display:block;} .file-info{background:var(--surface2);border:1px solid rgba(201,168,76,0.1);padding:30px;border-radius:4px;} .meta-grid{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:20px 0;font-size:0.9rem;} .meta-label{color:var(--gold);font-weight:bold;} .btn-action{display:inline-block;background:var(--gold);color:var(--deep);padding:10px 20px;text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:bold;margin-top:20px;}</style>
</head>
<body>
    <div id="sidebar">
        <header><h1>GIGA ARCHIVE</h1><a href="index.html" class="nav-link">← RETURN HOME</a></header>
        <div id="treeRoot"></div>
    </div>
    <div id="content"><div id="fileDetail" style="display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-style: italic;">Select a neural artifact from the lattice...</div></div>
    <script>
        async function init() {
            const res = await fetch('GIGA/folder-structure.json');
            const data = await res.json();
            document.getElementById('treeRoot').appendChild(renderNode(data));
        }
        function renderNode(node) {
            const div = document.createElement('div');
            div.className = 'tree-node';
            if (node.type === 'folder') {
                const label = document.createElement('div');
                label.className = 'folder';
                label.textContent = node.name;
                div.appendChild(label);
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'children';
                node.children.forEach(child => childrenDiv.appendChild(renderNode(child)));
                div.appendChild(childrenDiv);
                label.onclick = (e) => { e.stopPropagation(); label.classList.toggle('open'); childrenDiv.classList.toggle('visible'); };
            } else {
                const label = document.createElement('div');
                label.className = 'file';
                label.textContent = node.name;
                label.onclick = (e) => { e.stopPropagation(); showFileDetail(node); };
                div.appendChild(label);
            }
            return div;
        }
        function showFileDetail(node) {
            const relativePath = node.path.replace('public/', '');
            document.getElementById('fileDetail').innerHTML = '<div class="file-info"><h2>' + node.name + '</h2><div class="meta-grid"><div class="meta-label">PATH</div><div>' + node.path + '</div><div class="meta-label">SIZE</div><div>' + (node.size / 1024).toFixed(2) + ' KB</div></div><a href="' + relativePath + '" class="btn-action" target="_blank">ACCESS ARTIFACT</a></div>';
        }
        init();
    </script>
</body>
</html>
