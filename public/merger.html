<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AYR DESIGN</title><style>body{font-family:Arial,sans-serif;text-align:center;background:#f4f4f4;margin:0;padding:20px;}.slideshow-container{max-width:800px;margin:auto;position:relative;border:2px solid #333;border-radius:10px;overflow:hidden;background:black;}.mySlides{display:none;width:100%;}.mySlides img{width:100%;height:auto;display:block;}.prev,.next{cursor:pointer;position:absolute;top:50%;width:auto;padding:16px;margin-top:-22px;color:white;font-weight:bold;font-size:18px;transition:0.3s;background:rgba(0,0,0,0.5);border-radius:50%;}.prev{left:10px;}.next{right:10px;}.prev:hover,.next:hover{background:rgba(0,0,0,0.8);}.dots{text-align:center;margin-top:15px;}.dot{cursor:pointer;height:15px;width:15px;margin:0 5px;background-color:#bbb;border-radius:50%;display:inline-block;transition:background-color 0.3s;}.dot.active{background-color:#333;}</style></head><body><h1></h1><div class="slideshow-container"><div class="mySlides"><img src="NnaRA.jpg" alt="Slide 1"></div><div class="mySlides"><img src="8nfNi.jpg" alt="Slide 2"></div><div class="mySlides"><img src="M1VZE.jpg" alt="Slide 3"></div><div class="mySlides"><img src="unprofessional.jpg" alt="Slide 4"></div><div class="mySlides"><img src="should.png" alt="Slide 5"></div><a class="prev" onclick="plusSlides(-1)">&#10094;</a><a class="next" onclick="plusSlides(1)">&#10095;</a></div><div class="dots"><span class="dot" onclick="currentSlide(1)"></span><span class="dot" onclick="currentSlide(2)"></span><span class="dot" onclick="currentSlide(3)"></span></div><script>let slideIndex = 1; showSlides(slideIndex); setInterval(() => { plusSlides(1); }, 4000); function plusSlides(n) { showSlides(slideIndex += n); } function currentSlide(n) { showSlides(slideIndex = n); } function showSlides(n) { let i; let slides = document.getElementsByClassName("mySlides"); let dots = document.getElementsByClassName("dot"); if (n > slides.length) slideIndex = 1; if (n < 1) slideIndex = slides.length; for (i = 0; i < slides.length; i++) { slides[i].style.display = "none"; } for (i = 0; i < dots.length; i++) { dots[i].className = dots[i].className.replace(" active", ""); } slides[slideIndex - 1].style.display = "block"; dots[slideIndex - 1].className += " active"; }</script></body></html>
