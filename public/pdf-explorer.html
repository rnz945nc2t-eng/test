<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethyr Global | PDF Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:wght@300;400&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
    <style>:root{--gold:#c9a84c;--deep:#07070c;--surface:#111118;--text:#d8d2c4;--text-dim:#7a7568;} body{background-color:var(--deep);color:var(--text);font-family:'Crimson Pro',serif;margin:0;display:flex;height:100vh;overflow:hidden;} #sidebar{width:300px;background:var(--surface);border-right:1px solid rgba(201,168,76,0.2);overflow-y:auto;padding:20px;flex-shrink:0;} #viewer{flex-grow:1;background:#1a1a1a;display:flex;flex-direction:column;} header{padding:20px;border-bottom:1px solid rgba(201,168,76,0.1);} h1{font-family:'Cinzel',serif;font-size:1.2rem;color:var(--gold);margin:0;letter-spacing:0.1em;} .nav-link{display:block;margin-top:10px;color:var(--text-dim);text-decoration:none;font-size:0.8rem;font-family:'JetBrains Mono',monospace;} .nav-link:hover{color:var(--gold);} .pdf-list{list-style:none;padding:0;margin:20px 0;} .pdf-item{padding:10px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;font-size:0.9rem;transition:all 0.2s;word-break:break-all;} .pdf-item:hover{background:rgba(201,168,76,0.1);color:var(--gold);} .pdf-item.active{border-left:3px solid var(--gold);background:rgba(201,168,76,0.15);color:#fff;} iframe{width:100%;height:100%;border:none;} .empty-state{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-style:italic;}</style>
</head>
<body>
    <div id="sidebar">
        <header><h1>PDF EXPLORER</h1><a href="index.html" class="nav-link">← RETURN HOME</a></header>
        <ul class="pdf-list" id="pdfList"></ul>
    </div>
    <div id="viewer"><div id="pdfFrameContainer" class="empty-state">Select a document from the archive to begin decryption...</div></div>
    <script src="pdf-list.js"></script>
    <script>
        const listEl = document.getElementById('pdfList');
        const frameContainer = document.getElementById('pdfFrameContainer');
        PDF_FILES.sort().forEach(file => {
            const li = document.createElement('li');
            li.className = 'pdf-item';
            li.textContent = file.split('/').pop();
            li.title = file;
            li.onclick = () => {
                document.querySelectorAll('.pdf-item').forEach(i => i.classList.remove('active'));
                li.classList.add('active');
                frameContainer.innerHTML = '<iframe src="' + file + '"></iframe>';
                frameContainer.classList.remove('empty-state');
            };
            listEl.appendChild(li);
        });
    </script>
</body>
</html>
